---
layout: default
---
{% include menu.html %}
<main>
  <article class="wrap page-head post">
    <p class="back"><a href="/posts/">All posts</a></p>
    <h1>{% include t.html text=page.title %}</h1>
    <p><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <div class="prose post-body">{{ content }}</div>
  </article>
</main>
